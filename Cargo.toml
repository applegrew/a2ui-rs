[workspace]
members = [
    "a2ui-types",
    "a2ui-core",
    "a2ui-validation",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/applegrew/a2ui-rs"
homepage = "https://github.com/applegrew/a2ui-rs"
keywords = ["a2ui", "agent", "ui", "protocol", "llm"]
categories = ["api-bindings", "data-structures"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
jsonschema = "0.28"
a2ui-types = { path = "a2ui-types", version = "0.2.0" }
a2ui-validation = { path = "a2ui-validation", version = "0.2.0" }
